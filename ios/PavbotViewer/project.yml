name: PavbotViewer
options:
  bundleIdPrefix: com.paweltanski
  developmentLanguage: pl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  postGenCommand: rm -f PavbotViewer.xcodeproj/xcshareddata/xcschemes/PavbotAudioActivityExtension.xcscheme
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SP774TZZU8
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "2.6.4"
    SWIFT_VERSION: "5.9"
configs:
  Debug: debug
  Release: release
targets:
  PavbotViewer:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/* 2.swift"
      - path: ../../public/pavbot-manifest.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paweltanski.pavbotviewer
        INFOPLIST_FILE: Sources/Info.plist
        CURRENT_PROJECT_VERSION: "260709.040728"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/PavbotViewer.entitlements
          APS_ENVIRONMENT: production
          CLOUDKIT_ENVIRONMENT: Production
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/PavbotViewer.entitlements
          APS_ENVIRONMENT: production
          CLOUDKIT_ENVIRONMENT: Production
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: ActivityKit.framework
      - sdk: Charts.framework
      - sdk: CloudKit.framework
      - sdk: CoreLocation.framework
      - sdk: MediaPlayer.framework
      - sdk: PDFKit.framework
      - sdk: UserNotifications.framework
      - target: PavbotAudioActivityExtension
        embed: true
  PavbotAudioActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AudioActivityExtension
      - path: Sources/Services/PavbotAudioActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paweltanski.pavbotviewer.audioactivity
        INFOPLIST_FILE: AudioActivityExtension/Info.plist
        CURRENT_PROJECT_VERSION: "260709.040728"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SP774TZZU8
        SWIFT_VERSION: "5.9"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
    scheme:
      management:
        isShown: false
  PavbotViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PavbotViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paweltanski.pavbotviewer.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PavbotViewer:
    build:
      targets:
        PavbotViewer: all
        PavbotViewerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PavbotViewerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
